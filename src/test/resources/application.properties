# Propiedades requeridas por el controlador
api.version=v1
app.version=test

# JPA: crear y destruir el esquema en cada ejecución de pruebas
spring.jpa.hibernate.ddl-auto=create-drop

# Cargar los datos iniciales después de crear el esquema de pruebas.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
